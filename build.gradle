buildscript {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        // "+" = always resolve the newest published Loom build automatically.
        classpath "net.fabricmc:fabric-loom:+"
    }
}

plugins {
    id 'maven-publish'
}

apply plugin: "net.fabricmc.fabric-loom"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Stage 5 will add: maven { url = "https://repo.hypixel.net/repository/Hypixel/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No `mappings(...)` line: 26.1.2 is unobfuscated and ships Mojang's real
    // names directly, so there is nothing for Loom to remap against.

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
