name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the release step can attach the jar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4'

      - name: Build
        run: gradle build --stacktrace

      - name: Run tests
        run: gradle test --stacktrace

      # Always upload the jar as a workflow artifact, even on plain commits -
      # this is the easy "just give me a download link" path for every push.
      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyblock-tracker-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # On top of that, when you push a tag like v0.1.0, also publish it as
      # a proper GitHub Release with the jar attached, so there's a stable
      # download link that doesn't require digging through Actions runs.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
